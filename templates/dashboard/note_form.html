{% extends "base.html" %}
{% block title %}{{ 'Edit' if note else 'New' }} Note{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h2 class="page-title">
      <i class="bi bi-{{ 'pencil' if note else 'journal-plus' }} me-2 text-purple"></i>
      {{ 'Edit Note' if note else 'New Note' }}
    </h2>
  </div>
  <a href="{{ url_for('notes.index') }}" class="btn btn-ghost">
    <i class="bi bi-arrow-left me-2"></i>Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="vault-card">
      <div class="vault-card-body">
        <form method="POST"
              action="{{ url_for('notes.edit', note_id=note.id) if note else url_for('notes.new') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}" />

          <div class="mb-3">
            <label class="form-label text-muted small">Title</label>
            <input type="text" class="form-control vault-input" name="title"
                   value="{{ note.title if note else '' }}" required placeholder="Note title" />
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">
              Content <span class="badge bg-secondary ms-1"><i class="bi bi-lock-fill me-1"></i>Encrypted</span>
            </label>
            <textarea class="form-control vault-input mono" name="content" rows="12"
                      placeholder="Write your secure note here…">{{ note.content if note else '' }}</textarea>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted small">Tags (comma-separated)</label>
            <input type="text" class="form-control vault-input" name="tags"
                   value="{{ note.tags if note else '' }}" placeholder="work, personal, idea" />
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-vault">
              <i class="bi bi-floppy me-2"></i>Save Note
            </button>
            <a href="{{ url_for('notes.index') }}" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
